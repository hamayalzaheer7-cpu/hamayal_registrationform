<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <!--boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--css-->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card p-4">

                    <h2 class="text-center mb-4"> Registration Form</h2>

                <form id="myForm">

                        <!--name-->
                        <label class="form-label">Name</label>
                        <input type="text" id="name" class="form-control mb-3" placeholder="Enter name">

                        <!--emial-->
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control mb-3" placeholder="Enter email">

                        <!-- Phone-->
                        <label class="form-label">Phone</label>
                        <input type="tel" id="phone" class="form-control mb-3" placeholder="Enter phone">

                        <!-- password -->
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control mb-3" placeholder="Enter password">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control mb-3"
                            placeholder="Confirm password">

                        <!-- Course-->
                        <label class="form-label">Course</label>
                        <select id="course" class="form-select mb-3">
                            <option value="">Select Course</option>
                            <option value="IT">SALES</option>
                            <option value="CS">WEB</option>
                            <option value="SE">SHOPIFY</option>
                            <option value="SE">UI/UX</option>
                            <option value="SE">AI/ML</option>

                        </select>

                        <button type="submit" class="btn">
                            Register
                        </button>

                        <!--message -->
                        <p id="message" class="text-center mt-3"></p>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
